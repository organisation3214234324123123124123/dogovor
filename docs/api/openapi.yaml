      - members_count
      - members
      title: SeriesDetail
      type: object
    SeriesRead:
      properties:
        active_meeting_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Встреча в live или closing, если идёт
          title: Active Meeting Id
        capture_mode:
          $ref: '#/components/schemas/CaptureMode'
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        last_meeting_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Начало последней встречи
          title: Last Meeting At
        load_warning_threshold:
          description: Сколько открытых пунктов у исполнителя за 7 дней должно набраться,
            чтобы показать предупреждение (BR-9)
          examples:
          - 5
          title: Load Warning Threshold
          type: integer
        members_count:
          examples:
          - 4
          title: Members Count
          type: integer
        open_items_count:
          description: Пункты серии в pending и accepted
          examples:
          - 8
          title: Open Items Count
          type: integer
        planned_duration_min:
          examples:
          - 30
          title: Planned Duration Min
          type: integer
        status:
          $ref: '#/components/schemas/SeriesStatus'
        timezone:
          examples:
          - Europe/Moscow
          title: Timezone
          type: string
        title:
          examples:
          - Еженедельная планёрка по запуску оплаты
          title: Title
          type: string
      required:
      - id
      - title
      - timezone
      - planned_duration_min
      - capture_mode
      - status
      - created_at
      - load_warning_threshold
      - open_items_count
      - members_count
      title: SeriesRead
      type: object
    SeriesStatus:
      enum:
      - active
      - archived
      title: SeriesStatus
      type: string
    SeriesUpdate:
      additionalProperties: false
      properties:
        load_warning_threshold:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          description: Порог предупреждения о перегрузке, по умолчанию 5 (FR-26.7)
          title: Load Warning Threshold
        planned_duration_min:
          anyOf:
          - description: Плановая длительность, минут
            examples:
            - 30
            maximum: 240.0
            minimum: 15.0
            type: integer
          - type: 'null'
          title: Planned Duration Min
        timezone:
          anyOf:
          - description: Пояс IANA
            examples:
            - Europe/Moscow
            type: string
          - type: 'null'
          title: Timezone
        title:
          anyOf:
          - examples:
            - Еженедельная планёрка по запуску оплаты
            maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: SeriesUpdate
      type: object
    SummaryText:
      description: Итог простым текстом для мессенджера, без ссылок /p/ и токенов
        (FR-36).
      properties:
        items_total:
          examples:
          - 6
          title: Items Total
          type: integer
        text:
          examples:
          - 'Итоги встречи 16.10

            1. Разобраться с выгрузкой — Иван Петров, до 23.10'
          title: Text
          type: string
      required:
      - text
      - items_total
      title: SummaryText
      type: object
    TokenRead:
      description: Ответ `/auth/token` (Swagger); тот же JWT ставится в cookie `session`.
      properties:
        access_token:
          description: 'JWT для заголовка Authorization: Bearer'
          title: Access Token
          type: string
        expires_in:
          description: Срок жизни сессии, секунд
          examples:
          - 604800
          title: Expires In
          type: integer
        token_type:
          const: bearer
          default: bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/UserRead'
      required:
      - access_token
      - expires_in
      - user
      title: TokenRead
      type: object
    UserRead:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          examples:
          - host@example.com
          title: Email
          type: string
        full_name:
          examples:
          - Мария Соколова
          title: Full Name
          type: string
        id:
          format: uuid
          title: Id
          type: string
        timezone:
          description: Пояс ведущего (IANA)
          examples:
          - Europe/Moscow
          title: Timezone
          type: string
      required:
      - id
      - email
      - full_name
      - timezone
      - created_at
      title: UserRead
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    APIKeyCookie:
      in: cookie
      name: session
      type: apiKey
    AdminToken:
      description: 'Служебный доступ: значение ADMIN_TOKEN. Если оно пусто, /admin
        выключен.'
      in: header
      name: X-Admin-Token
      type: apiKey
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/auth/token
      type: oauth2
info:
  description: '

    **Как попробовать** (локально `docker compose up`: демо-данные и вход через Authorize

    включает `compose.override.yaml`, `DEV_MODE=1`):

    `POST /api/v1/auth/login` или кнопка **Authorize** (username `host@example.com`,

    password `demo1234`), затем `GET /api/v1/series`.


    Ошибки приходят как `application/problem+json` с полем `code`.

    Изменение пункта идёт с заголовком `If-Match: <version>`.

    Живая панель работает по WebSocket `/ws/meetings/{id}`, сообщения описаны схемой
    `LiveEvent`.

    '
  title: Договорились API
  version: dev
openapi: 3.1.0
paths:
  /api/v1/admin/export/events.csv:
    get:
      description: 'События analytics_events без ПДн за период. Служебный доступ:
        заголовок `X-Admin-Token`; сессия ведущего не подходит.'
      operationId: export_events_api_v1_admin_export_events_csv_get
      parameters:
      - description: С какой даты (UTC), включительно
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: С какой даты (UTC), включительно
          title: From
      - description: По какую дату (UTC), включительно
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: По какую дату (UTC), включительно
          title: To
      responses:
        '200':
          content:
            text/csv:
              example: name,created_at,user_id,series_id,meeting_id,item_id,props
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет или неверный X-Admin-Token (ADMIN_FORBIDDEN); ADMIN_TOKEN
            не задан (ADMIN_DISABLED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - AdminToken: []
      summary: Выгрузка событий в CSV
      tags:
      - admin
  /api/v1/admin/llm/prompts:
    get:
      description: 'Контракт LLM: все версии по задачам, сначала новые. Служебный
        доступ: заголовок `X-Admin-Token`.'
      operationId: list_prompts_api_v1_admin_llm_prompts_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PromptRead'
                title: Response List Prompts Api V1 Admin Llm Prompts Get
                type: array
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет или неверный X-Admin-Token (ADMIN_FORBIDDEN); ADMIN_TOKEN
            не задан (ADMIN_DISABLED)
      security:
      - AdminToken: []
      summary: Версии промптов LLM
      tags:
      - admin
    post:
      description: Только новая строка в llm_prompts, старые не меняются. При `activate=true`
        новая версия становится единственной активной для задачи.
      operationId: create_prompt_api_v1_admin_llm_prompts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptRead'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет или неверный X-Admin-Token (ADMIN_FORBIDDEN); ADMIN_TOKEN
            не задан (ADMIN_DISABLED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
      security:
      - AdminToken: []
      summary: Новая версия промпта
      tags:
      - admin
  /api/v1/admin/persons/{person_id}/anonymize:
    post:
      description: 'Обезличивание по 152-ФЗ: имя меняется на «Участник N», e-mail
        удаляется, комментарии чистятся, ссылки отзываются. Пункты и статистика остаются.
        Служебный доступ: `X-Admin-Token`.'
      operationId: anonymize_person_api_v1_admin_persons__person_id__anonymize_post
      parameters:
      - in: path
        name: person_id
        required: true
        schema:
          format: uuid
          title: Person Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymizeResult'
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет или неверный X-Admin-Token (ADMIN_FORBIDDEN); ADMIN_TOKEN
            не задан (ADMIN_DISABLED)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Объекта нет или он чужой
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - AdminToken: []
      summary: Обезличить участника
      tags:
      - admin
  /api/v1/agenda/{agenda_id}:
    patch:
      description: Меняет название, позицию или статус пункта повестки.
      operationId: update_agenda_item_api_v1_agenda__agenda_id__patch
      parameters:
      - in: path
        name: agenda_id
        required: true
        schema:
          format: uuid
          title: Agenda Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaItemUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaItemRead'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет сессии или она истекла
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Объекта нет или он чужой
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Серия в архиве (SERIES_ARCHIVED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
      security:
      - APIKeyCookie: []
      - OAuth2PasswordBearer: []
      summary: Изменить пункт повестки
      tags:
      - meetings
  /api/v1/auth/login:
    post:
      description: 'Ставит httpOnly-cookie `session` (JWT, 7 дней), в теле - пользователь,
        токена в теле нет. Демо (при DEMO_DATA=1): host@example.com / demo1234.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверный e-mail или пароль (UNAUTHORIZED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Превышен лимит, см. Retry-After
      summary: Вход ведущего
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Сбрасывает cookie сессии. Bearer-токен живёт до своего срока.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
      summary: Выход
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Кто вошёл. Фронт зовёт при старте, 401 - показать вход.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет сессии или она истекла
      security:
      - APIKeyCookie: []
      - OAuth2PasswordBearer: []
      summary: Текущий ведущий
      tags:
      - auth
  /api/v1/auth/password-reset:
    post:
      description: Шлёт письмо со ссылкой на 1 час. Ответ одинаковый для любого e-mail.
      operationId: password_reset_api_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
      summary: Запросить сброс пароля
      tags:
      - auth
  /api/v1/auth/password-reset/confirm:
    post:
      description: Токен одноразовый, живёт 1 час; истёк или использован - 410.
      operationId: password_reset_confirm_api_v1_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      responses:
        '204':
          description: Successful Response
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Токен истёк или уже использован (LINK_EXPIRED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
      summary: Задать новый пароль по токену
      tags:
      - auth
  /api/v1/auth/register:
    post:
      description: Без подтверждения e-mail. Без согласия на обработку ПДн - 422 (NFR-12);
        время согласия пишется в `users.pd_consent_at`. Создаёт свою сторону ведущего.
        Занятый e-mail - 409 `EMAIL_TAKEN`.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: E-mail уже занят (EMAIL_TAKEN)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
      summary: Регистрация ведущего
      tags:
      - auth
  /api/v1/auth/token:
    post:
      description: 'Для кнопки Swagger «Authorize» и скриптов: поле `username` - e-mail.
        Отдаёт Bearer-токен в теле и ставит cookie `session`, как `/auth/login`. Только
        при DEV_MODE=1, иначе 404.'
      operationId: login_form_api_v1_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_form_api_v1_auth_token_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRead'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверный e-mail или пароль (UNAUTHORIZED)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Объекта нет или он чужой
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Неверные данные; причина в поле code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Превышен лимит, см. Retry-After
      summary: Вход через форму OAuth2
      tags:
      - auth
  /api/v1/health:
    get:
      operationId: health_api_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: База недоступна (db=down)
      summary: Проба живости
      tags:
      - health
  /api/v1/items/{item_id}:
    delete:
      description: Только до рассылки, вместе с пробелами. После рассылки - 409, пункт
        можно только «Снять».
      operationId: delete_item_api_v1_items__item_id__delete
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          format: uuid
          title: Item Id
          type: string
      - description: Версия пункта из поля `version` или заголовка ETag, например
          `3` или `"3"`
        in: header
        name: If-Match
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Версия пункта из поля `version` или заголовка ETag, например
            `3` или `"3"`
          title: If-Match
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет сессии или она истекла
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Объекта нет или он чужой
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: VERSION_CONFLICT - пункт уже изменён; INVALID_TRANSITION -
            недопустимый переход; SERIES_ARCHIVED - серия в архиве
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет заголовка If-Match
      security:
      - APIKeyCookie: []
      - OAuth2PasswordBearer: []
      summary: Удалить пункт в draft
      tags:
      - items
    get:
      description: Поля, статус, открытые пробелы и последний ответ исполнителя. Заголовок
        ETag - версия для If-Match.
      operationId: get_item_api_v1_items__item_id__get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          format: uuid
          title: Item Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCard'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Нет сессии или она истекла
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json: {}
          description: Объекта нет или он чужой
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyCookie: []
      - OAuth2PasswordBearer: []
      summary: Карточка пункта
      tags:
      - items
    patch:
      description: В панели правятся все поля. После рассылки - только «что», срок
