components:
  schemas:
    AcceptInMeetingRequest:
      properties:
        value:
          description: true - поставить «Согласовано на встрече», false - снять (OQ-10)
          examples:
          - true
          title: Value
          type: boolean
      required:
      - value
      title: AcceptInMeetingRequest
      type: object
    ActorType:
      enum:
      - host
      - assignee
      - system
      - tracker
      title: ActorType
      type: string
    AgendaItemCreate:
      properties:
        title:
          examples:
          - Статус интеграции с банком
          maxLength: 300
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: AgendaItemCreate
      type: object
    AgendaItemRead:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        position:
          examples:
          - 1
          title: Position
          type: integer
        status:
          $ref: '#/components/schemas/AgendaItemStatus'
        title:
          examples:
          - Статус интеграции с банком
          title: Title
          type: string
        uncovered:
          default: false
          description: 'В режиме закрытия: тема открыта и ни одно решение к ней не
            привязано (FR-27)'
          title: Uncovered
          type: boolean
      required:
      - id
      - position
      - title
      - status
      title: AgendaItemRead
      type: object
    AgendaItemStatus:
      enum:
      - open
      - covered
      - moved
      title: AgendaItemStatus
      type: string
    AgendaItemUpdate:
      additionalProperties: false
      properties:
        position:
          anyOf:
          - maximum: 20.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Position
        status:
          anyOf:
          - $ref: '#/components/schemas/AgendaItemStatus'
          - type: 'null'
        title:
          anyOf:
          - maxLength: 300
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: AgendaItemUpdate
      type: object
    AnonymizeResult:
      properties:
        anonymized_at:
          format: date-time
          title: Anonymized At
          type: string
        comments_cleared:
          examples:
          - 1
          title: Comments Cleared
          type: integer
        full_name:
          description: Новое имя
          examples:
          - Участник 7
          title: Full Name
          type: string
        links_revoked:
          examples:
          - 2
          title: Links Revoked
          type: integer
        person_id:
          format: uuid
          title: Person Id
          type: string
      required:
      - person_id
      - full_name
      - anonymized_at
      - links_revoked
      - comments_cleared
      title: AnonymizeResult
      type: object
    AssigneeResponse:
      properties:
        at:
          format: date-time
          title: At
          type: string
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Новый срок для reschedule
          title: Due Date
        kind:
          $ref: '#/components/schemas/CommentKind'
          description: reschedule - новый срок, not_mine - «Это не моё»
        text:
          anyOf:
          - type: string
          - type: 'null'
          description: Комментарий исполнителя
          examples:
          - Демо проводит Анна
          title: Text
      required:
      - kind
      - at
      title: AssigneeResponse
      type: object
    Body_login_form_api_v1_auth_token_post:
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
        grant_type:
          anyOf:
          - pattern: ^password$
            type: string
          - type: 'null'
          title: Grant Type
        password:
          format: password
          title: Password
          type: string
        scope:
          default: ''
          title: Scope
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_form_api_v1_auth_token_post
      type: object
    CancelAction:
      properties:
        action:
          const: cancel
          title: Action
          type: string
      required:
      - action
      title: CancelAction
      type: object
    CaptureMode:
      enum:
      - manual
      - audio
      title: CaptureMode
      type: string
    ClosureTrigger:
      enum:
      - button
      - timer
      title: ClosureTrigger
      type: string
    CommentKind:
      enum:
      - not_mine
      - reschedule
      title: CommentKind
      type: string
    DeclineRequest:
      properties:
        comment:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: Необязательно
          examples:
          - Демо проводит Анна
          title: Comment
      title: DeclineRequest
      type: object
    DoneAction:
      properties:
        action:
          const: done
          title: Action
          type: string
      required:
      - action
      title: DoneAction
      type: object
    DoneBy:
      enum:
      - assignee
      - host
      - tracker
      title: DoneBy
      type: string
    EmailQueueHealth:
      properties:
        failed_24h:
          examples:
          - 0
          title: Failed 24H
          type: integer
        oldest_queued_age_s:
          anyOf:
          - type: integer
          - type: 'null'
          description: Возраст старейшего письма, секунд
          title: Oldest Queued Age S
        queued:
          examples:
          - 0
          title: Queued
          type: integer
      required:
      - queued
      - failed_24h
      title: EmailQueueHealth
      type: object
    GapRead:
      description: Пробел пункта (FR-20, FR-21). В пункте приходят только открытые.
      properties:
        blocking:
          default: false
          description: Блокирует «Согласовано на встрече» (BR-3)
          title: Blocking
          type: boolean
        detected_at:
          format: date-time
          title: Detected At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        question:
          anyOf:
          - type: string
          - type: 'null'
          description: Готовый вопрос ведущему, до 120 символов
          examples:
          - Иван, к какому сроку?
          title: Question
        source:
          $ref: '#/components/schemas/GapSource'
          description: rule - правило, llm - нейросеть
        type:
          $ref: '#/components/schemas/GapType'
          examples:
          - no_due
      required:
      - id
      - type
      - source
      - detected_at
      title: GapRead
      type: object
    GapSource:
      enum:
      - rule
      - llm
      title: GapSource
      type: string
    GapType:
      enum:
      - no_assignee
      - no_due
      - due_vague
      - due_past
      - vague_action
      title: GapType
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Health:
      description: Состояние сервиса; при недоступной БД ручка отвечает 503 (NFR-11).
      properties:
        db:
          enum:
          - ok
          - down
          title: Db
          type: string
        email_queue:
          $ref: '#/components/schemas/EmailQueueHealth'
        llm:
          $ref: '#/components/schemas/LlmHealth'
        status:
          enum:
          - ok
          - degraded
          - down
          title: Status
          type: string
        version:
          description: 'Версия бэка: фронт сверяет её со своей'
          examples:
          - dev
          title: Version
          type: string
        worker_last_run_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Когда воркер последний раз отправил письмо; null - ещё не отправлял
          title: Worker Last Run At
      required:
      - status
      - version
      - db
      - email_queue
      - llm
      title: Health
      type: object
    ItemAction:
      enum:
      - created
      - updated
      - accepted_in_meeting
      - sent
      - accepted
      - rescheduled
      - disputed
      - reassigned
      - done
      - cancelled
      - reopened
      title: ItemAction
      type: string
    ItemCard:
      description: Карточка пункта для ведущего.
      properties:
        accept_blocked_reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Почему нельзя; null, если можно
          title: Accept Blocked Reason
        accepted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Accepted At
        accepted_in_meeting:
          description: Отмечено «Согласовано на встрече»
          title: Accepted In Meeting
          type: boolean
        agenda_item_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Agenda Item Id
        assignee:
          anyOf:
          - $ref: '#/components/schemas/PersonBrief'
          - type: 'null'
          description: Исполнитель; null - не назначен
        can_accept_in_meeting:
          description: Можно ли отметить «Согласовано» (BR-3)
          title: Can Accept In Meeting
          type: boolean
        cancelled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Cancelled At
        created_at:
          format: date-time
          title: Created At
          type: string
        done_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Done At
        done_by:
          anyOf:
          - $ref: '#/components/schemas/DoneBy'
          - type: 'null'
        done_criteria:
          anyOf:
          - type: string
          - type: 'null'
          description: Критерий «готово»
          examples:
          - Файл выгрузки в общей папке
          title: Done Criteria
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Срок в поясе серии
          examples:
          - '2026-10-16'
          title: Due Date
        due_text:
          anyOf:
          - type: string
          - type: 'null'
          description: Срок словами из строки
          examples:
          - к пятнице
          title: Due Text
        gaps:
          description: Открытые пробелы
          items:
            $ref: '#/components/schemas/GapRead'
          title: Gaps
          type: array
        id:
          format: uuid
          title: Id
          type: string
        is_overdue:
          description: Срок прошёл, а пункт в pending или accepted
          title: Is Overdue
          type: boolean
        last_response:
          anyOf:
          - $ref: '#/components/schemas/AssigneeResponse'
          - type: 'null'
          description: 'Последний ответ исполнителя: новый срок или «не моё» с комментарием'
        manual_fields:
          description: Поля, правленные ведущим руками; LLM их не трогает (BR-15)
          examples:
          - - what
          items:
            type: string
          title: Manual Fields
          type: array
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        meeting_planned_start:
          format: date-time
          title: Meeting Planned Start
          type: string
        overload_warning:
          anyOf:
          - $ref: '#/components/schemas/OverloadWarning'
          - type: 'null'
          description: Только в ответе на создание и правку пункта
        raw_text:
          description: Исходная строка ведущего
          examples:
          - Иван разберётся с выгрузкой к пятнице
          title: Raw Text
          type: string
        reschedule_count:
          description: Сколько раз меняли срок после рассылки
          title: Reschedule Count
          type: integer
        sent_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Sent At
        series_id:
          format: uuid
          title: Series Id
          type: string
        series_title:
          examples:
          - Еженедельная планёрка по запуску оплаты
          title: Series Title
          type: string
        source:
          $ref: '#/components/schemas/ItemSource'
        status:
          $ref: '#/components/schemas/ItemStatus'
        suggested:
          description: Предложен автоматически
          title: Suggested
          type: boolean
        updated_at:
          format: date-time
          title: Updated At
          type: string
        version:
          description: Версия для If-Match
          examples:
          - 1
          title: Version
          type: integer
        what:
          anyOf:
          - type: string
          - type: 'null'
          description: Что сделать
          examples:
          - Разобраться с выгрузкой
          title: What
      required:
      - id
      - meeting_id
      - series_id
      - raw_text
      - manual_fields
      - source
      - suggested
      - status
      - is_overdue
      - accepted_in_meeting
      - can_accept_in_meeting
      - reschedule_count
      - version
      - gaps
      - created_at
      - updated_at
      - series_title
      - meeting_planned_start
      title: ItemCard
      type: object
    ItemCreate:
      properties:
        agenda_item_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Пункт повестки этой встречи
          title: Agenda Item Id
        raw_text:
          description: Строка решения
          examples:
          - Иван разберётся с выгрузкой к пятнице
          maxLength: 1000
          minLength: 1
          title: Raw Text
          type: string
      required:
      - raw_text
      title: ItemCreate
      type: object
    ItemEventRead:
      description: 'Строка журнала пункта: кто, что, когда.'
      properties:
        action:
          $ref: '#/components/schemas/ItemAction'
        actor_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Имя ведущего или исполнителя
          examples:
          - Иван Петров
          title: Actor Name
        actor_type:
          $ref: '#/components/schemas/ActorType'
        created_at:
          format: date-time
          title: Created At
          type: string
        data:
          additionalProperties: true
          description: Только id, статусы и даты (BR-19)
          examples:
          - status_from: draft
            status_to: pending
          title: Data
          type: object
        id:
          title: Id
          type: integer
      required:
      - id
      - action
      - actor_type
      - data
      - created_at
      title: ItemEventRead
      type: object
    ItemPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ItemRead'
          title: Items
          type: array
        limit:
          examples:
          - 50
          title: Limit
          type: integer
        offset:
          examples:
          - 0
          title: Offset
          type: integer
        on_time_share_30d:
          anyOf:
          - type: number
          - type: 'null'
          description: 'Доля сделанного в срок за 30 дней (FR-44): пункты со сроком
            в последние 30 дней, сделанные не позже срока, / все такие пункты, кроме
            снятых. Учитывает фильтр по исполнителю. null - таких пунктов нет'
          examples:
          - 0.67
          title: On Time Share 30D
        total:
          examples:
          - 42
          title: Total
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      title: ItemPage
      type: object
    ItemRead:
      description: 'Пункт: одна договорённость встречи.'
      properties:
        accept_blocked_reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Почему нельзя; null, если можно
          title: Accept Blocked Reason
        accepted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Accepted At
        accepted_in_meeting:
          description: Отмечено «Согласовано на встрече»
          title: Accepted In Meeting
          type: boolean
        agenda_item_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Agenda Item Id
        assignee:
          anyOf:
          - $ref: '#/components/schemas/PersonBrief'
          - type: 'null'
          description: Исполнитель; null - не назначен
        can_accept_in_meeting:
          description: Можно ли отметить «Согласовано» (BR-3)
          title: Can Accept In Meeting
          type: boolean
        cancelled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Cancelled At
        created_at:
          format: date-time
          title: Created At
          type: string
        done_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Done At
        done_by:
          anyOf:
          - $ref: '#/components/schemas/DoneBy'
          - type: 'null'
        done_criteria:
          anyOf:
          - type: string
          - type: 'null'
          description: Критерий «готово»
          examples:
          - Файл выгрузки в общей папке
          title: Done Criteria
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Срок в поясе серии
          examples:
          - '2026-10-16'
          title: Due Date
        due_text:
          anyOf:
          - type: string
          - type: 'null'
          description: Срок словами из строки
          examples:
          - к пятнице
          title: Due Text
        gaps:
          description: Открытые пробелы
          items:
            $ref: '#/components/schemas/GapRead'
          title: Gaps
          type: array
        id:
          format: uuid
          title: Id
          type: string
        is_overdue:
          description: Срок прошёл, а пункт в pending или accepted
          title: Is Overdue
          type: boolean
        manual_fields:
          description: Поля, правленные ведущим руками; LLM их не трогает (BR-15)
          examples:
          - - what
          items:
            type: string
          title: Manual Fields
          type: array
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        overload_warning:
          anyOf:
          - $ref: '#/components/schemas/OverloadWarning'
          - type: 'null'
          description: Только в ответе на создание и правку пункта
        raw_text:
          description: Исходная строка ведущего
          examples:
          - Иван разберётся с выгрузкой к пятнице
          title: Raw Text
          type: string
        reschedule_count:
          description: Сколько раз меняли срок после рассылки
          title: Reschedule Count
          type: integer
        sent_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Sent At
        series_id:
          format: uuid
          title: Series Id
          type: string
        source:
          $ref: '#/components/schemas/ItemSource'
        status:
          $ref: '#/components/schemas/ItemStatus'
        suggested:
          description: Предложен автоматически
          title: Suggested
          type: boolean
        updated_at:
          format: date-time
          title: Updated At
          type: string
        version:
          description: Версия для If-Match
          examples:
          - 1
          title: Version
          type: integer
        what:
          anyOf:
          - type: string
          - type: 'null'
          description: Что сделать
          examples:
          - Разобраться с выгрузкой
          title: What
      required:
      - id
      - meeting_id
      - series_id
      - raw_text
      - manual_fields
      - source
      - suggested
      - status
      - is_overdue
      - accepted_in_meeting
      - can_accept_in_meeting
      - reschedule_count
      - version
      - gaps
      - created_at
      - updated_at
      title: ItemRead
      type: object
    ItemSource:
      enum:
      - manual
      - asr
      title: ItemSource
      type: string
    ItemStatus:
      enum:
      - draft
      - pending
      - accepted
      - disputed
      - done
      - cancelled
      title: ItemStatus
      type: string
    ItemUpdate:
      additionalProperties: false
      description: 'Правка полей (FR-13, FR-16). Переданные поля попадают в manual_fields.

        После рассылки исполнителя меняют только через actions/reassign.'
      properties:
        assignee_person_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Только участник серии (BR-1)
          title: Assignee Person Id
        done_criteria:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Done Criteria
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: Не раньше сегодня (BR-2)
          examples:
          - '2026-10-30'
          title: Due Date
        due_text:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          title: Due Text
        what:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          examples:
          - Выгрузить отчёт по оттоку
          title: What
      title: ItemUpdate
      type: object
    LinkExpiredProblem:
      properties:
        code:
          description: Стабильный код для фронтенда
          examples:
          - INVALID_TRANSITION
          title: Code
          type: string
        detail:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Переход из done в pending запрещён
          title: Detail
        host_name:
          anyOf:
          - type: string
          - type: 'null'
          description: Кому написать
          examples:
          - Мария Соколова
          title: Host Name
        instance:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - /api/v1/items/3f0c.../actions
          title: Instance
        status:
          examples:
          - 409
          title: Status
          type: integer
        title:
          examples:
          - Conflict
          title: Title
          type: string
        type:
          default: about:blank
          examples:
          - about:blank
          title: Type
          type: string
      required:
      - title
      - status
      - code
      title: LinkExpiredProblem
      type: object
    LiveEvent:
      description: Сообщение сервера в WS /ws/meetings/{id} (FR-14).
      properties:
        data:
          additionalProperties: true
          description: ItemRead или список GapRead
          title: Data
          type: object
        event:
          description: То же, что type
          enum:
          - item.created
          - item.updated
          - item.deleted
          - gaps.updated
          - closure.opened
          - agenda.updated
          - meeting.sent
          title: Event
          type: string
        item_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Item Id
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        type:
          enum:
          - item.created
          - item.updated
          - item.deleted
          - gaps.updated
          - closure.opened
          - agenda.updated
