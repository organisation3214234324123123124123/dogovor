name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Минимальное покрытие кода бэкенда тестами, %.
  COV_MIN: "90"

jobs:
  # Линтер и все тесты бэкенда на настоящих PostgreSQL и Redis
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaderhelp
          POSTGRES_PASSWORD: leaderhelp
          POSTGRES_DB: leaderhelp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaderhelp" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://leaderhelp:leaderhelp@localhost:5432/leaderhelp_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_EAGER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-report=term --cov-fail-under=${COV_MIN}

  # Контракт API: docs/api/openapi.yaml совпадает с тем, что отдаёт код
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --frozen
      - run: make openapi
      - run: git diff --exit-code -- docs/api/openapi.yaml

  # Миграции: одна голова Alembic, накатываются на пустую базу
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaderhelp
          POSTGRES_PASSWORD: leaderhelp
          POSTGRES_DB: leaderhelp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaderhelp" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://leaderhelp:leaderhelp@localhost:5432/leaderhelp_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --frozen
      - run: make migrations-check
      - run: cd backend && uv run alembic upgrade head

  # Поиск секретов (gitleaks) по всей истории репозитория
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose

  # Всё с нуля, как в README: docker compose up без .env, сквозной сценарий, Swagger, DDL совпадает с миграциями
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: docker compose up
        run: docker compose up -d --build
      - name: Ждём /api/v1/health (до 3 минут)
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/v1/health; then echo; exit 0; fi
            sleep 2
          done
          echo "бэкенд не поднялся за 3 минуты"
          docker compose ps -a
          docker compose logs --tail=200
          exit 1
      - name: Сквозной сценарий (tests/smoke/smoke.sh)
        run: bash tests/smoke/smoke.sh http://localhost:8000
      - name: db/schema.sql совпадает с миграциями
        run: |
          bash db/dump_schema.sh
          git diff --exit-code -- db/schema.sql
      - name: Состояние стека при падении
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200
      - name: docker compose down -v
        if: always()
        run: docker compose down -v
