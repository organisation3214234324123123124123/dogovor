name: release

# Публикация образа бэкенда в GHCR (ghcr.io/<владелец>/dogovor-backend).
# main -> теги main и sha-<7>, только после зелёного CI; тег vX.Y.Z -> тег X.Y.Z.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
      - id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/dogovor-backend
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ steps.sha.outputs.short }},enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="sha-${{ steps.sha.outputs.short }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
